[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popdesk"
version = "0.1.0"
description = "**🔔 Trigger Windows desktop notifications from anywhere via webhooks 🌐**"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn",
    "pyngrok",
    "python-dotenv",
    "pydantic",
]

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "python-multipart>=0.0.22",
    "pytest>=9.0.3,<10",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E501"]
